steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - artifacts
  - generic
  - download
  - --project=cmoc-prod
  - --location=us
  - --repository=codemender-cli-production
  - --package=cm
  - --version=stable
  - --name=cm-linux-amd64.zip
  - --destination=./

- name: 'ubuntu'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    unzip cm-linux-amd64.zip
    chmod +x cm
    mv cm /usr/local/bin/
    export PATH="/usr/local/bin:$PATH"
    echo $PATH
    ls
    cm init
    cm find

options:
  logging: CLOUD_LOGGING_ONLY
